<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>برنامج العهدة</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--tx:#1b2430;--mu:#6b7785;--pr:#0f766e;--ln:#e3e8ee;--bad:#c0392b;--ok:#15803d;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10151b;--card:#1a222c;--tx:#e8edf2;--mu:#93a1b0;--pr:#2dd4bf;--ln:#2a3542;--bad:#ff7b6b;--ok:#4ade80;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10151b;--card:#1a222c;--tx:#e8edf2;--mu:#93a1b0;--pr:#2dd4bf;--ln:#2a3542;--bad:#ff7b6b;--ok:#4ade80;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;padding-bottom:84px}
main{max-width:680px;margin:0 auto;padding:12px}
h2{font-size:18px;margin:6px 0 10px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:12px;margin-bottom:10px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--ln)}
.row:last-child{border:0}
.mu{color:var(--mu);font-size:13px}.b{font-weight:700}.bad{color:var(--bad)}.ok{color:var(--ok)}
input,select{width:100%;padding:10px;border:1px solid var(--ln);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit;margin-bottom:8px}
button{font:inherit;border:0;border-radius:10px;padding:10px 14px;background:var(--pr);color:#fff;font-weight:700;cursor:pointer}
button.g{background:transparent;color:var(--bad);padding:4px 8px}
button.s{background:var(--bg);color:var(--tx);border:1px solid var(--ln)}
.chips{display:flex;gap:6px;margin-bottom:10px;overflow-x:auto}.chips button{white-space:nowrap}
.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom,0px);z-index:50}
.tabs button{flex:1;background:none;color:var(--mu);border-radius:0;padding:8px 2px;font-size:11px}
.tabs button.on{color:var(--pr)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.big{font-size:20px;font-weight:700}
h3{font-size:14px;margin:10px 0 6px;color:var(--mu)}input[type=checkbox]{width:auto;margin:0}label.chk{display:flex;align-items:center;gap:8px;margin-bottom:8px}button.edit{background:transparent;color:var(--pr);padding:4px 8px;border:1px solid var(--pr)}
table{width:100%;border-collapse:collapse}th,td{padding:8px 6px;border-bottom:1px solid var(--ln);text-align:right}th{color:var(--mu);font-size:13px}td.n,th.n{text-align:left}tr.t td{font-weight:700;background:var(--bg)}
.gr{overflow-x:auto;margin-bottom:8px}.gr table{width:auto;min-width:max-content}.gr th,.gr td{padding:3px;text-align:center;border:1px solid var(--ln);font-size:13px}.gr .l{position:sticky;right:0;background:var(--card);font-weight:700;min-width:62px;z-index:1}.gr input{width:48px;margin:0;padding:6px 2px;text-align:center}.gr button.cy{width:44px;padding:6px 0;background:var(--bg);color:var(--tx);border:1px solid var(--ln)}input.pi{width:70px;margin:0;padding:5px;text-align:center}
.stmt-box{background:#fff;color:#000;border-radius:8px;padding:4px;overflow-x:auto;margin:10px 0;page-break-inside:avoid}
.stmt-box table{border:2px solid #222;border-collapse:collapse;width:100%;color:#000}
.stmt-box td,.stmt-box th{border:1px solid #333;padding:6px 4px;text-align:center;font-size:13px;color:#000}
.float-bar{position:fixed;bottom:64px;left:12px;right:12px;max-width:656px;margin:0 auto;background:var(--card);border:2px solid var(--pr);border-radius:12px;padding:8px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px;box-shadow:0 4px 16px rgba(0,0,0,.25);z-index:45}
@media print{
  .tabs,button,select,.noprint,.float-bar{display:none!important}
  body{padding:0;background:#fff!important;color:#000!important}
  main{max-width:100%!important;padding:0!important}
  .card{border:1px solid #999;background:#fff!important;color:#000!important;box-shadow:none}
  .stmt-box{margin:0 0 18px 0!important;padding:0!important;overflow:visible!important}
}
</style>
</head>
<body>
<main id="app"></main>
<nav class="tabs" id="tabs"></nav>
<script>
let SITES=['العاصمة','أكتوبر','السوق'];
const TABS=[['sum','📊','الملخص'],['c','💰','العهدة'],['w','👷','المواقع'],['o','🧾','مصروفات'],['p','🤝','تصفيات'],['m','📒','مديونيات'],['ex','📑','مستخلصات']];
const SUB={o:['x','z']};
const D=['date','التاريخ','date'],A=['amount','المبلغ','number'];
const L={c:{t:'العهدة',f:[D,A,['r','المستلم','text']],s:x=>f(x.amount)+' · '+esc(x.r)},
 x:{t:'نثريات',f:[D,['d','البيان','text'],A],s:x=>f(x.amount)+' · '+esc(x.d)},
 z:{t:'زيد السوق',f:[D,['k','النوع','select',['مصاريف','سلف']],A,['n','ملاحظة','text']],s:x=>x.k+': '+f(x.amount)+' '+esc(x.n)},
 p:{t:'تصفيات',f:[D,['name','الاسم','list'],A,['s','الموقع','select','SITES'],['n','ملاحظات','text']],s:x=>esc(x.name)+': '+f(x.amount)+' ('+x.s+') '+esc(x.n)},
 m:{t:'مديونيات',f:[D,['name','الاسم','list'],A],s:x=>esc(x.name)+': '+f(x.amount)}};
let S;try{S=JSON.parse(localStorage.getItem('ohda2'))}catch(e){}
S=Object.assign({c:[],x:[],z:[],p:[],m:[],w:[],e:[],sf:[],se:[],ex:[]},S||{});
S.ex=S.ex||[];
S.sites=S.sites||SITES.slice();SITES=S.sites;
S.w.forEach(w=>{w.meterRate=w.meterRate||0;w.helperRate=w.helperRate||0;w.prev=w.prev||{days:0,ot:0,exp:0,meterQty:0,adv:0}});
const today=()=>new Date().toISOString().slice(0,10);
let openStmt=null,openEx=null;let tab='sum',site=SITES[0],openW=null,mon=today().slice(0,7),sub={o:'x',q:'p'},selW=new Set(),multiPrint=false;
const save=()=>{try{localStorage.setItem('ohda2',JSON.stringify(S))}catch(e){}if(DBc&&cloud!='loading'){try{localStorage.setItem('ohda2_dirty','1')}catch(e){}cloud='saving';stat();clearTimeout(saveT);saveT=setTimeout(pushCloud,700)}};
const $=s=>document.querySelector(s);
const sum=(a,k='amount')=>a.reduce((t,y)=>t+(+y[k]||0),0);
const f=n=>(+n||0).toLocaleString('en-US',{maximumFractionDigits:2});
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cls=n=>n<0?'bad':'ok';
const inM=d=>mon=='all'||(d||'').slice(0,7)==mon,bef=d=>mon!='all'&&(d||'')<mon;
const M=a=>a.filter(x=>inM(x.date));
const earn=(e,w)=>(+e.days||0)*(e.rt!=null?+e.rt:+w.rt||0)+(+e.ot||0)*(e.otRate!=null?+e.otRate:+w.ot||0)+(+e.q||0)*(+e.r||0);
const ded=e=>(+e.x||0)+(+e.a||0)+(+e.g||0);
function acct(w){
 const sc=d=>!w.since||(d||'')>=w.since,E=S.e.filter(e=>e.w==w.id&&sc(e.date)),pr=w.prev||{},hr=+w.helperRate||0,PS=S.p.filter(p=>p.name==w.n&&sc(p.date));
 const rt=e=>e.rt!=null?+e.rt:+w.rt||0,ot=e=>e.otRate!=null?+e.otRate:+w.ot||0;
 const agg=L=>({days:sum(L,'days'),ot:sum(L,'ot'),q:sum(L,'q'),x:sum(L,'x'),a:sum(L,'a'),g:sum(L,'g'),hd:L.reduce((t,e)=>t+(+e.hd||(e.helper?1:0)),0),dA:L.reduce((t,e)=>t+(+e.days||0)*rt(e),0),oA:L.reduce((t,e)=>t+(+e.ot||0)*ot(e),0),mA:L.reduce((t,e)=>t+(+e.q||0)*(+e.r||0),0)});
 const A=agg(E.filter(e=>bef(e.date))),C=agg(E.filter(e=>inM(e.date))),M={days:+pr.days||0,ot:+pr.ot||0,q:+pr.meterQty||0,x:+pr.exp||0,a:+pr.adv||0,g:0,hd:+pr.hd||0};
 M.dA=M.days*(+w.rt||0);M.oA=M.ot*(+w.ot||0);M.mA=M.q*(+w.meterRate||0);
 const P={},T={};for(const k in C){P[k]=A[k]+M[k];T[k]=P[k]+C[k]}
 const e=o=>o.dA+o.oA+o.mA,d=o=>o.x+o.a+o.g+o.hd*hr;
 return{P,C,T,A,M,hr,E,paidP:sum(PS.filter(p=>bef(p.date))),paidC:sum(PS.filter(p=>inM(p.date))),earnP:e(P),earnC:e(C),earnT:e(T),dedP:d(P),dedC:d(C),dedT:d(T)}}
function wst(w){const a=acct(w),r={prev:a.earnP-a.dedP-a.paidP,earn:a.earnC,x:a.C.x,a:a.C.a,g:a.C.g,helperDays:a.C.hd,helperCost:a.C.hd*a.hr,paid:a.paidC,days:a.C.days,ot:a.C.ot,meter:a.C.q,debt:sum(S.m.filter(m=>m.name==w.n))};
 r.bal=r.prev+r.earn-r.x-r.a-r.g-r.helperCost-r.paid;return r}
function rr(){const g=$('#gs'),sl=g?g.scrollLeft:0,sy=scrollY;render();const g2=$('#gs');if(g2)g2.scrollLeft=sl;scrollTo(0,sy)}
async function del(c,id){if(!await sure('متأكد من الحذف؟'))return;S[c]=S[c].filter(x=>x.id!=id);save();render()}
function go(t){tab=t;openW=null;openStmt=null;openEx=null;multiPrint=false;render();scrollTo(0,0)}
const siteIds=s=>S.w.filter(w=>w.s==s).map(w=>w.id);
const getSiteIn=s=>sum(S.sf.filter(x=>x.site==s&&inM(x.date)));
const getSiteOut=s=>sum(S.se.filter(x=>x.site==s&&inM(x.date)));
const getWX=s=>sum(S.e.filter(e=>siteIds(s).includes(e.w)&&inM(e.date)),'x');
const getWA=s=>sum(S.e.filter(e=>siteIds(s).includes(e.w)&&inM(e.date)),'a');

function vSum(){
 const cu=sum(M(S.c)),sf=SITES.map(x=>[x,getSiteIn(x)]),zd=sum(M(S.z)),kh=sum(M(S.x)),tp=sum(M(S.p).filter(x=>!x.ded));
 const out=sf.reduce((t,r)=>t+r[1],0)+zd+kh+tp,rest=cu-out,R=(l,v)=>`<div class="row"><span>${l}</span><b>${f(v)}</b></div>`;
 return`<div class="card"><div class="mu">إجمالي الواصل من العهدة</div><div class="big">${f(cu)}</div></div>
 <div class="card"><h3>📤 المصروف من العهدة</h3>${sf.map(r=>R('الواصل لموقع '+r[0],r[1])).join('')}${R('الواصل لزيد السوق',zd)}${R('إجمالي الخوارج (نثريات)',kh)}${R('إجمالي التصفيات',tp)}<div class="row"><b>إجمالي المصروف</b><b>${f(out)}</b></div></div>
 <div class="card"><div class="mu">العهدة المتبقية (الواصل − المصروف)</div><div class="big ${cls(rest)}">${f(rest)}</div></div>
 <div class="g2"><button onclick="exportXlsx()">📥 تصدير Excel</button><button class="s" onclick="$('#xf').click()">📤 استيراد Excel</button></div><input type="file" id="xf" accept=".xlsx" style="display:none" onchange="impX(this)">
 <div class="g2" style="margin-top:8px"><button class="s" onclick="bk()">نسخ البيانات</button><button class="s" onclick="rs()">استرجاع نسخة</button></div>`}
function debtCard(){const m={};S.m.forEach(x=>m[x.name]=(m[x.name]||0)+(+x.amount||0));const r=Object.entries(m).filter(e=>Math.abs(e[1])>0.001);
 return`<div class="card"><h3>📒 المتبقي على كل شخص (كل الشهور)</h3>${r.map(e=>`<div class="row"><span>${esc(e[0])}</span><b class="${cls(-e[1])}">${f(e[1])}</b></div>`).join('')||'<div class="mu">لا توجد مديونيات</div>'}<div class="row"><b>الإجمالي</b><b>${f(sum(S.m))}</b></div></div><p class="mu">بتتخصم تلقائي من مستحقات الشخص لما تضغط "تصفية" في صفحته.</p>`}
function setSub(t,k){sub[t]=k;render()}
const chips=(a,cur,t)=>'<div class="chips">'+a.map(k=>`<button class="${k==cur?'':'s'}" onclick="setSub('${t}','${k}')">${L[k].t}</button>`).join('')+'</div>';
function vL(k){const c=L[k],l=(k=='m'?S[k]:M(S[k])).sort((a,b)=>b.date.localeCompare(a.date));
 return`<div class="card">${c.f.map(([key,lb,ty,op])=>ty=='select'?`<select id="f_${key}">${(op=='SITES'?[...SITES,'أخرى']:op).map(o=>`<option>${o}</option>`).join('')}</select>`:`<input id="f_${key}" type="${ty=='list'?'text':ty}" ${ty=='list'?'list="wl"':''} placeholder="${lb}" value="${ty=='date'?today():''}" ${ty=='number'?'inputmode="decimal"':''}>`).join('')}
 <datalist id="wl">${S.w.map(w=>`<option>${esc(w.n)}</option>`).join('')}</datalist><button onclick="addL('${k}')">إضافة</button></div>
 ${k=='m'?debtCard():''}<input id="q_${k}" placeholder="🔍 بحث بالاسم أو التاريخ أو الملاحظة (في كل الشهور)" oninput="$('#lst').innerHTML=ledList('${k}',this.value)"><div id="lst">${ledList(k,'')}</div>`}
function ledList(k,q){const c=L[k];q=(q||'').trim().toLowerCase();let l=k=='m'||q?S[k]:M(S[k]);
 if(q)l=l.filter(x=>[x.name,x.s,x.n,x.date,x.d,x.r,x.k,x.amount].some(v=>String(v??'').toLowerCase().includes(q)));l=[...l].sort((a,b)=>b.date.localeCompare(a.date));
 return`<div class="card"><div class="row b"><span>${q?'نتائج البحث (كل الشهور) — '+l.length:'إجمالي '+c.t}</span><span>${f(sum(k=='p'?l.filter(x=>!x.ded):l))}</span></div>${l.map(x=>`<div class="row"><div><div class="b">${c.s(x)}</div><div class="mu">${x.date}</div></div><div style="display:flex;gap:4px"><button class="edit" onclick="editL('${k}','${x.id}')">تعديل</button><button class="g" onclick="del('${k}','${x.id}')">حذف</button></div></div>`).join('')||'<div class="mu">لا توجد نتائج</div>'}</div>`}
function addL(k){const o={id:uid()};L[k].f.forEach(x=>o[x[0]]=$('#f_'+x[0]).value);if(!+o.amount)return;o.amount=+o.amount;S[k].push(o);save();render()}
async function editL(k,id){const x=S[k].find(i=>i.id==id);if(!x)return;
 const r=await formDlg('تعديل — '+L[k].t,L[k].f.map(([key,lb,ty,op])=>({k:key,l:lb,t:ty=='list'?'text':ty=='select'?undefined:ty,o:ty=='select'?[...new Set([x[key],...(op=='SITES'?[...SITES,'أخرى']:op)])]:undefined,v:x[key]})));
 if(r){Object.assign(x,r);save();render()}}

function toggleSel(id){selW.has(id)?selW.delete(id):selW.add(id);render()}
function selectAll(){S.w.filter(w=>w.s==site).forEach(w=>selW.add(w.id));render()}
function clearSel(){selW.clear();render()}
function printSelected(){const valid=S.w.filter(w=>selW.has(w.id));if(!valid.length){say('اختار عامل واحد على الأقل');return}multiPrint=true;render();scrollTo(0,0)}

// دالة بناء جدول التصفية الرسمي (تُستخدم للتصفية الفردية والجماعية)
function buildStmtTable(w){
 const a=acct(w),T=a.T,hr=a.hr,m=w.ty=='meter',paid=a.paidP+a.paidC,net=a.earnT-a.dedT-paid;
 const rows=[];if(m){const g={};a.E.filter(e=>+e.q>0&&(bef(e.date)||inM(e.date))).forEach(e=>{const k=(e.note||'بند')+'|'+(+e.r||0);(g[k]=g[k]||{n:e.note||'بند',r:+e.r||0,q:0}).q+=+e.q});Object.values(g).forEach(i=>rows.push([i.n,i.q,i.r,i.q*i.r]));if(a.M.q)rows.push(['متر (الشهر السابق)',a.M.q,+w.meterRate||0,a.M.mA])}
 if(T.days)rows.push(['يوميات',T.days,Math.round(T.dA/T.days),T.dA]);if(T.ot)rows.push(['سهرات',T.ot,Math.round(T.oA/T.ot),T.oA]);
 const B='border:1px solid #333;padding:6px 4px;text-align:center;font-size:13px',amt=x=>f(x)+' ج.م.',Y=(l,v,st='')=>`<tr><td colspan="3" style="${B};${st}">${l}</td><td style="${B};${st}">${amt(v)}</td></tr>`;
 const ded=[];if(T.hd)ded.push(`<tr><td style="${B}">خصم عمالة</td><td style="${B}">${f(T.hd)}</td><td style="${B}">${f(hr)}</td><td style="${B}">${amt(T.hd*hr)}</td></tr>`);
 if(T.g)ded.push(Y('خصومات أخرى',T.g));
 ded.push(Y('مصاريف',T.x),Y('سلف',T.a),Y('اجمالي الخصومات',a.dedT,'background:#eee;font-weight:700'));
 if(paid)ded.push(Y('مدفوع سابقاً (تصفيات)',paid));
 const N=1+rows.length+1+ded.length,d=new Date(),ds=d.toLocaleDateString('ar-EG',{weekday:'long'})+' '+String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear();
 return`<div class="stmt-box"><table>
 <tr><td colspan="5" style="${B};background:#e7e7e7;font-weight:700;font-size:16px">${esc(w.n)} - ${esc(w.s)} -</td></tr>
 <tr style="background:#e7e7e7"><td style="${B};font-weight:700">البند</td><td style="${B};font-weight:700">الكمية</td><td style="${B};font-weight:700">الفئة</td><td style="${B};font-weight:700">الإجمالي</td><td rowspan="${N}" style="${B};writing-mode:vertical-rl;transform:rotate(180deg);font-weight:700;width:28px;font-size:12px">${ds}</td></tr>
 ${rows.length?rows.map(r=>`<tr><td style="${B}">${esc(r[0])}</td><td style="${B}">${f(r[1])}</td><td style="${B}">${f(r[2])}</td><td style="${B};background:#fff2cc">${amt(r[3])}</td></tr>`).join(''):`<tr><td colspan="4" style="${B};color:#666">لا توجد مستحقات مسجلة</td></tr>`}
 <tr><td colspan="3" style="${B};background:#d9e1ec;font-weight:700">الاجمالي</td><td style="${B};background:#d9e1ec;color:red;font-weight:700">${amt(a.earnT)}</td></tr>${ded.join('')}
 <tr><td colspan="3" style="${B};background:#d9e1ec;font-weight:700">اجمالي المستحقات</td><td colspan="2" style="${B};background:#d9e1ec;color:red;font-weight:700;font-size:15px">${amt(net)}</td></tr></table></div>`;
}

function vMultiPrint(){
 const ws=S.w.filter(w=>selW.has(w.id));
 return`<div class="noprint" style="display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap">
  <button class="s" onclick="multiPrint=false;render()">→ رجوع</button>
  <button onclick="doPrint()">🖨️ طباعة الكل (${ws.length})</button>
  <button class="s" onclick="clearSel();multiPrint=false;render()">إلغاء التحديد</button>
 </div>
 <h2 class="noprint">معاينة الطباعة الجماعية (${ws.length} عامل من مواقع مختلفة)</h2>
 ${ws.map(w=>buildStmtTable(w)).join('')}`;
}

function vWork(){
 if(openStmt)return vStmt(S.w.find(w=>w.id==openStmt));if(openW)return vW(S.w.find(w=>w.id==openW));if(multiPrint)return vMultiPrint();
 const ws=S.w.filter(w=>w.s==site),fin=getSiteIn(site),se=getSiteOut(site),we=getWX(site),wa=getWA(site),net=fin-se-we-wa;
 const selValid=S.w.filter(w=>selW.has(w.id));

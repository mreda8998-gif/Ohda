<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>برنامج العهدة</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--tx:#1b2430;--mu:#6b7785;--pr:#0f766e;--ln:#e3e8ee;--bad:#c0392b;--ok:#15803d;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10151b;--card:#1a222c;--tx:#e8edf2;--mu:#93a1b0;--pr:#2dd4bf;--ln:#2a3542;--bad:#ff7b6b;--ok:#4ade80;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10151b;--card:#1a222c;--tx:#e8edf2;--mu:#93a1b0;--pr:#2dd4bf;--ln:#2a3542;--bad:#ff7b6b;--ok:#4ade80;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;padding-bottom:76px}
main{max-width:640px;margin:0 auto;padding:12px}
h2{font-size:18px;margin:6px 0 10px}
h3{font-size:14px;margin:10px 0 6px;color:var(--mu)}
.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:12px;margin-bottom:10px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--ln)}
.row:last-child{border:0}
.mu{color:var(--mu);font-size:13px}.b{font-weight:700}.bad{color:var(--bad)}.ok{color:var(--ok)}
input,select{width:100%;padding:10px;border:1px solid var(--ln);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit;margin-bottom:8px}
input[type=checkbox]{width:auto;margin:0}
label.chk{display:flex;align-items:center;gap:8px;margin-bottom:8px;cursor:pointer}
button{font:inherit;border:0;border-radius:10px;padding:10px 14px;background:var(--pr);color:#fff;font-weight:700;cursor:pointer}
button.g{background:transparent;color:var(--bad);padding:4px 8px}
button.s{background:var(--bg);color:var(--tx);border:1px solid var(--ln)}
button.edit{background:transparent;color:var(--pr);padding:4px 8px;border:1px solid var(--pr)}
.chips{display:flex;gap:6px;margin-bottom:10px;overflow-x:auto}.chips button{white-space:nowrap}
.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs button{flex:1;background:none;color:var(--mu);border-radius:0;padding:10px 2px;font-size:13px}
.tabs button.on{color:var(--pr)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.big{font-size:20px;font-weight:700}
.tabs button{font-size:12px}@media print{.tabs,button,select,.noprint{display:none!important}body{padding:0}main{max-width:100%}}
</style>
</head>
<body>
<main id="app"><div style="text-align:center;padding:50px;font-size:20px;">جاري تحميل البرنامج...</div></main>
<nav class="tabs" id="tabs"></nav>
<script>
window.onerror = function(msg, url, line) {
    document.getElementById('app').innerHTML = '<div style="color:red;padding:20px;direction:rtl;text-align:center;font-size:18px;margin-top:50px;">حدث خطأ برمجي:<br><br><b>' + msg + '</b><br>السطر: ' + line + '</div>';
    return false;
};

const SITES=['العاصمة','أكتوبر','السوق'];
const TABS=[['sum','📊','الملخص'],['c','💰','العهدة'],['w','👷','المواقع'],['o','🧾','مصروفات'],['q','🤝','تصفيات']];
const SUB={o:['x','z'],q:['p','m']};
const D=['date','التاريخ','date'],A=['amount','المبلغ','number'];
const L={c:{t:'العهدة',f:[D,A,['r','المستلم','text']],s:x=>f(x.amount)+' · '+esc(x.r)},
 x:{t:'نثريات',f:[D,['d','البيان','text'],A],s:x=>f(x.amount)+' · '+esc(x.d)},
 z:{t:'زيد السوق',f:[D,['k','النوع','select',['مصاريف','سلف']],A,['n','ملاحظة','text']],s:x=>x.k+': '+f(x.amount)+' '+esc(x.n)},
 p:{t:'تصفيات',f:[D,['name','الاسم','list'],A,['s','الموقع','select',['العاصمة','أكتوبر','السوق','أخرى']],['n','ملاحظات','text']],s:x=>esc(x.name)+': '+f(x.amount)+' ('+x.s+') '+esc(x.n)},
 m:{t:'مديونيات',f:[D,['name','الاسم','list'],A],s:x=>esc(x.name)+': '+f(x.amount)}};

let S;try{S=JSON.parse(localStorage.getItem('ohda2'))}catch(e){}
S=Object.assign({c:[],x:[],z:[],p:[],m:[],w:[],e:[],sf:[],se:[]},S||{});
S.w.forEach(w=>{
  if(w.meterRate==null)w.meterRate=0;
  if(w.helperRate==null)w.helperRate=0;
  if(!w.prev)w.prev={days:0,ot:0,exp:0,meterQty:0};
});
const today=()=>new Date().toISOString().slice(0,10);
let tab='sum',site=SITES[0],openW=null,mon=today().slice(0,7),sub={o:'x',q:'p'};
let selW=new Set(), multiPrint=false;
const save=()=>{try{localStorage.setItem('ohda2',JSON.stringify(S))}catch(e){}};
const $=s=>document.querySelector(s);
const sum=(a,k='amount')=>a.reduce((t,y)=>t+(+y[k]||0),0);
const f=n=>(+n||0).toLocaleString('en-US');
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cls=n=>n<0?'bad':'ok';
const inM=d=>mon=='all'||(d||'').slice(0,7)==mon, bef=d=>mon!='all'&&(d||'')<mon;

function earn(e,w){
  const rt=e.rt!=null?+e.rt:(w?+w.rt||0:0);
  const otRate=e.otRate!=null?+e.otRate:(w?+w.ot||0:0);
  return (+e.days||0)*rt + (+e.ot||0)*otRate + (+e.q||0)*(+e.r||0);
}
const ded=e=>(+e.x||0)+(+e.a||0)+(+e.g||0);

function wst(w){
  const es=S.e.filter(e=>e.w==w.id), ps=S.p.filter(p=>p.name==w.n),
        B=es.filter(e=>bef(e.date)), C=es.filter(e=>inM(e.date));
  const prevEntries=B.reduce((t,e)=>t+earn(e,w)-ded(e),0)-sum(ps.filter(p=>bef(p.date)));
  const p=w.prev||{};
  const prevManual=(+p.days||0)*(+w.rt||0)+(+p.ot||0)*(+w.ot||0)+(+p.meterQty||0)*(+w.meterRate||0)-(+p.exp||0);
  const prev=prevEntries+prevManual;
  const helperDays=C.filter(e=>e.helper).length;
  const helperCost=helperDays*(+w.helperRate||0);
  const r={
    prev,
    earn:C.reduce((t,e)=>t+earn(e,w),0),
    x:sum(C,'x'), a:sum(C,'a'), g:sum(C,'g'),
    helperDays, helperCost,
    paid:sum(ps.filter(p=>inM(p.date))),
    days:sum(C,'days'), ot:sum(C,'ot'),
    meter:C.reduce((t,e)=>t+(+e.q||0),0),
    debt:sum(S.m.filter(m=>m.name==w.n))
  };
  r.bal=r.prev+r.earn-r.x-r.a-r.g-r.helperCost-r.paid;
  return r;
}
function del(c,id){if(!confirm('متأكد من الحذف؟'))return;S[c]=S[c].filter(x=>x.id!=id);save();render()}
function go(t){tab=t;openW=null;multiPrint=false;render();scrollTo(0,0)}
const M=a=>a.filter(x=>inM(x.date));

function getSiteIn(s){ return sum(S.sf.filter(x=>x.site==s && inM(x.date))); }
function getSiteOut(s){ return sum(S.se.filter(x=>x.site==s && inM(x.date))); }
function getSiteWorkersExp(s){ 
  const ids=S.w.filter(w=>w.s==s).map(w=>w.id);
  return S.e.filter(e=>ids.indexOf(e.w)>-1 && inM(e.date)).reduce((t,e)=>t+(+e.x||0),0);
}
function getSiteWorkersAdv(s){ 
  const ids=S.w.filter(w=>w.s==s).map(w=>w.id);
  return S.e.filter(e=>ids.indexOf(e.w)>-1 && inM(e.date)).reduce((t,e)=>t+(+e.a||0),0);
}

function vSum(){
 const cu=sum(M(S.c));
 let totalFunds=0, totalSiteExp=0, totalWorkerExp=0, totalWorkerAdv=0;
 let siteRows=[];
 SITES.forEach(s=>{
    let f1=getSiteIn(s), se=getSiteOut(s), we=getSiteWorkersExp(s), wa=getSiteWorkersAdv(s);
    totalFunds+=f1; totalSiteExp+=se; totalWorkerExp+=we; totalWorkerAdv+=wa;
    siteRows.push([s, f1, se, we, wa]);
 });
 const genExp=sum(M(S.x))+sum(M(S.z));
 const rest=cu - (totalSiteExp + totalWorkerExp + totalWorkerAdv + genExp);

 let html='<div class="g2"><div class="card"><div class="mu">إجمالي العهدة</div><div class="big">'+f(cu)+'</div></div><div class="card"><div class="mu">إجمالي الواصل للمواقع</div><div class="big ok">'+f(totalFunds)+'</div></div></div>';
 html+='<div class="card"><div class="mu">المتبقي من العهدة (السيولة)</div><div class="big '+cls(rest)+'">'+f(rest)+'</div></div>';
 html+='<div class="card"><h3>🏗️ تفاصيل المواقع</h3>';
 html+=siteRows.map(r=>'<div class="row"><div><b>'+r[0]+'</b><div class="mu">وارد: '+f(r[1])+' | مصروف: '+f(r[2]+r[3]+r[4])+'</div></div><b class="'+(cls(r[1]-(r[2]+r[3]+r[4])))+'">'+f(r[1]-(r[2]+r[3]+r[4]))+'</b></div>').join('');
 html+='</div>';
 html+='<div class="card"><h3>📉 إجمالي المصروفات</h3>';
 html+='<div class="row"><span>مصاريف المواقع</span><b>'+f(totalSiteExp)+'</b></div>';
 html+='<div class="row"><span>مصاريف العمال</span><b>'+f(totalWorkerExp)+'</b></div>';
 html+='<div class="row"><span>سلف العمال</span><b>'+f(totalWorkerAdv)+'</b></div>';
 html+='<div class="row"><span>نثريات وزيد السوق</span><b>'+f(genExp)+'</b></div>';
 html+='</div>';
 html+='<div class="g2"><button class="s" onclick="bk()">نسخ البيانات</button><button class="s" onclick="rs()">استرجاع نسخة</button></div>';
 return html;
}

function setSub(t,k){sub[t]=k;render();}
function chips(a,cur,t){return '<div class="chips">'+a.map(k=>'<button class="'+(k==cur?'':'s')+'" onclick="setSub(\''+t+'\',\''+k+'\')">'+(L[k]?L[k].t:k)+'</button>').join('')+'</div>';}

function vL(k){
 const c=L[k],l=M(S[k]).sort((a,b)=>b.date.localeCompare(a.date));
 let html='<div class="card">';
 c.f.forEach(function(x){
   let key=x[0],lb=x[1],ty=x[2],op=x[3];
   if(ty=='select'){ html+='<select id="f_'+key+'">'+op.map(o=>'<option>'+o+'</option>').join('')+'</select>'; }
   else { html+='<input id="f_'+key+'" type="'+(ty=='list'?'text':ty)+'" '+(ty=='list'?'list="wl"':'')+' placeholder="'+lb+'" value="'+(ty=='date'?today():'')+'" '+(ty=='number'?'inputmode="decimal"':'')+'>'; }
 });
 html+='<datalist id="wl">'+S.w.map(w=>'<option>'+esc(w.n)+'</option>').join('')+'</datalist><button onclick="addL(\''+k+'\')">إضافة</button></div>';
 html+='<div class="card"><div class="row b"><span>إجمالي '+c.t+'</span><span>'+f(sum(l))+'</span></div>'+l.map(x=>'<div class="row"><div><div class="b">'+c.s(x)+'</div><div class="mu">'+x.date+'</div></div><div style="display:flex;gap:4px"><button class="edit" onclick="editL(\''+k+'\',\''+x.id+'\')">تعديل</button><button class="g" onclick="del(\''+k+'\',\''+x.id+'\')">حذف</button></div></div>').join('')+'</div>';
 return html;
}
function addL(k){const o={id:uid()};L[k].f.forEach(x=>o[x[0]]=$('#f_'+x[0]).value);if(!o.amount&&k!='c')return;if(k=='c'&&!+o.amount)return;o.amount=+o.amount;S[k].push(o);save();render();}
function editL(k,id){const x=S[k].find(i=>i.id==id);if(!x)return;const nv=prompt('المبلغ الجديد:',x.amount);if(nv===null)return;x.amount=+nv||0;save();render();}

function toggleSel(id){ if(selW.has(id)) selW.delete(id); else selW.add(id); render(); }
function selectAll(){ S.w.filter(w=>w.s==site).forEach(w=>selW.add(w.id)); render(); }
function clearSel(){ selW.clear(); render(); }
function printSelected(){ if(S.w.filter(w=>selW.has(w.id)).length===0){ alert('اختار عامل واحد على الأقل'); return; } multiPrint=true; render(); scrollTo(0,0); }
function setSite(s){site=s;render();}
function setOpenW(id){openW=id;render();}

function vWork(){
 if(openW)return vW(S.w.find(w=>w.id==openW));
 if(multiPrint)return vMultiPrint();
 
 const ws=S.w.filter(w=>w.s==site);
 let fin=getSiteIn(site), se=getSiteOut(site), we=getSiteWorkersExp(site), wa=getSiteWorkersAdv(site);
 let net = fin - (se+we+wa);

 let html='<div class="chips">'+SITES.map(s=>'<button class="'+(s==site?'':'s')+'" onclick="setSite(\''+s+'\')">'+s+'</button>').join('')+'</div>';
 
 html+='<div class="card" style="border:2px solid var(--pr)"><h3>💼 تصفية الموقع</h3>';
 html+='<div class="row"><span>الواصل للموقع</span><b class="ok">'+f(fin)+'</b></div>';
 html+='<div class="row"><span>مصاريف الموقع</span><b class="bad">-'+f(se)+'</b></div>';
 html+='<div class="row"><span>مصاريف العمال</span><b class="bad">-'+f(we)+'</b></div>';
 html+='<div class="row"><span>سلف العمال</span><b class="bad">-'+f(wa)+'</b></div>';
 html+='<div class="row"><b>الصافي بالموقع</b><b class="big '+cls(net)+'">'+f(net)+'</b></div></div>';

 html+='<div class="card noprint"><h3>➕ إضافة حركة للموقع ('+site+')</h3>';
 html+='<input id="ed_site" type="date" value="'+today()+'">';
 html+='<select id="ty_site"><option value="in">وارد (فلوس جات للموقع)</option><option value="out">مصاريف موقع (خارجة)</option></select>';
 html+='<input type="number" id="amt_site" placeholder="المبلغ" inputmode="decimal">';
 html+='<input id="note_site" placeholder="ملاحظة (اختياري)">';
 html+='<button onclick="addSiteTx()">تسجيل الحركة</button></div>';

 let sf=S.sf.filter(x=>x.site==site && inM(x.date)).map(function(x){ var o=Object.assign({},x); o.ty='in'; return o; });
 let se_list=S.se.filter(x=>x.site==site && inM(x.date)).map(function(x){ var o=Object.assign({},x); o.ty='out'; return o; });
 let tx=sf.concat(se_list).sort(function(a,b){ return b.date.localeCompare(a.date); });

 if(tx.length){
   html+='<div class="card"><h3>📄 سجل حركات الموقع</h3>'+tx.map(x=>'<div class="row"><div><div class="b '+(x.ty=='in'?'ok':'bad')+'">'+(x.ty=='in'?'وارد: +':'مصروف: -')+f(x.amount)+'</div><div class="mu">'+x.date+' '+(x.note||'')+'</div></div><div style="display:flex;gap:4px"><button class="edit" onclick="editSiteTx(\''+x.ty+'\',\''+x.id+'\')">تعديل</button><button class="g" onclick="del(\''+(x.ty=='in'?'sf':'se')+'\',\''+x.id+'\')">حذف</button></div></div>').join('')+'</div>';
 }

 html+='<div class="card"><h3>➕ إضافة عامل جديد</h3><input id="n" placeholder="اسم العامل"><input id="jb" placeholder="الوظيفة"><select id="ty" onchange="document.getElementById(\'meterFields\').style.display=this.value==\'meter\'?\'block\':\'none\'"><option value="daily">باليومية</option><option value="meter">بالمتر</option></select><div class="g2"><input type="number" id="rt" placeholder="سعر اليومية" inputmode="decimal"><input type="number" id="ot" placeholder="سعر السهرة" inputmode="decimal"></div><div id="meterFields" style="display:none"><div class="g2"><input type="number" id="mr" placeholder="سعر المتر" inputmode="decimal"><input type="number" id="hr" placeholder="يومية المساعد" inputmode="decimal"></div></div><h3>📅 الشهر السابق</h3><div class="g2"><input type="number" id="pd" placeholder="عدد الأيام" inputmode="decimal"><input type="number" id="po" placeholder="السهرات" inputmode="decimal"><input type="number" id="pe" placeholder="المصاريف" inputmode="decimal"><input type="number" id="pm" placeholder="المتر" inputmode="decimal"></div><button onclick="addW()">إضافة عامل</button></div>';

 html+='<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;padding-bottom:8px;margin-bottom:8px;border-bottom:2px solid var(--ln);flex-wrap:wrap;gap:6px"><b>عمال الموقع ('+ws.length+')</b><div style="display:flex;gap:4px;flex-wrap:wrap"><button class="s" onclick="selectAll()">تحديد الكل</button>'+(selW.size?'<button class="s" onclick="clearSel()">إلغاء ('+selW.size+')</button>':'')+'<button onclick="printSelected()">🖨️ طباعة '+(selW.size?'('+selW.size+')':'')+'</button></div></div>';
 html+=(ws.length?ws.map(w=>{const s=wst(w),sel=selW.has(w.id);return '<div class="row"><input type="checkbox" '+(sel?'checked':'')+' onchange="toggleSel(\''+w.id+'\')"><div style="flex:1;cursor:pointer" onclick="setOpenW(\''+w.id+'\')"><div class="b">'+esc(w.n)+'</div><div class="mu">'+esc(w.jb)+' · '+(w.ty=='daily'?'يومية '+f(w.rt):'بالمتر '+f(w.meterRate||0))+'</div></div><span class="b '+cls(s.bal)+'" style="cursor:pointer" onclick="setOpenW(\''+w.id+'\')">'+f(s.bal)+'</span></div>'}).join(''):'<div class="mu">لا يوجد عمال</div>')+'</div>';
 return html;
}

function addSiteTx(){const a=+$('#amt_site').value;if(!a)return;const o={id:uid(),date:$('#ed_site').value||today(),site:site,amount:a,note:$('#note_site').value};if($('#ty_site').value=='in')S.sf.push(o);else S.se.push(o);save();render();}
function editSiteTx(ty,id){const arr=ty=='in'?S.sf:S.se;const x=arr.find(i=>i.id==id);if(!x)return;const nv=prompt('المبلغ الجديد:',x.amount);if(nv===null)return;x.amount=+nv||0;save();render();}

function addW(){const n=$('#n').value.trim();if(!n)return;S.w.push({id:uid(),n,jb:$('#jb').value,s:site,ty:$('#ty').value,rt:+$('#rt').value||0,ot:+$('#ot').value||0,meterRate:+$('#mr').value||0,helperRate:+$('#hr').value||0,prev:{days:+$('#pd').value||0,ot:+$('#po').value||0,exp:+$('#pe').value||0,meterQty:+$('#pm').value||0}});save();render();}
function updateRates(id){const w=S.w.find(w=>w.id==id);if(!w)return;w.rt=+$('#ert').value||0;w.ot=+$('#eot').value||0;if($('#emr'))w.meterRate=+$('#emr').value||0;if($('#ehr'))w.helperRate=+$('#ehr').value||0;save();render();}
function addE(){const w=S.w.find(w=>w.id==openW);if(!w)return;const v=i=>+($('#'+i)?.value)||0;const isM=w.ty=='meter';const e={id:uid(),w:openW,date:$('#ed').value||today(),rt:+w.rt||0,otRate:+w.ot||0,days:isM?0:v('ey'),ot:isM?0:v('eo'),q:isM?v('eq'):0,r:isM?(v('er')||w.meterRate||0):0,helper:isM&&($('#eh')?.checked||false),g:v('eg'),x:v('ex'),a:v('ea'),note:$('#en')?.value||''};if(!(e.days||e.ot||e.q||e.g||e.x||e.a))return;S.e.push(e);save();render();}
function editE(id){const e=S.e.find(i=>i.id==id);if(!e)return;const nx=prompt('تعديل المصاريف (اتركها 0 لو مفيش):',e.x);if(nx!==null)e.x=+nx||0;const na=prompt('تعديل السلفة (اتركها 0 لو مفيش):',e.a);if(na!==null)e.a=+na||0;save();render();}
function editQ(id){const e=S.e.find(e=>e.id==id);if(!e)return;const q=prompt('الكمية (متر):',e.q||0);if(q==null)return;e.q=+q||0;save();render();}
function delW(id){if(!confirm('حذف العامل وكل سجلاته؟'))return;S.w=S.w.filter(w=>w.id!=id);S.e=S.e.filter(e=>e.w!=id);selW.delete(id);openW=null;save();render()}

function vW(w){
 const s=wst(w),d=w.ty=='daily',isM=w.ty=='meter';
 const es=S.e.filter(e=>e.w==w.id&&inM(e.date)).sort((a,b)=>b.date.localeCompare(a.date));
 const I=(id,p,t='number',v='')=>'<input id="'+id+'" type="'+t+'" placeholder="'+p+'" '+(t=='number'?'inputmode="decimal"':'')+' value="'+v+'">';
 let html='<button class="s" onclick="openW=null;render()">→ رجوع للموقع</button> <button class="s" onclick="print()">طباعة</button><h2>'+esc(w.n)+' <span class="mu">('+w.s+')</span></h2>';
